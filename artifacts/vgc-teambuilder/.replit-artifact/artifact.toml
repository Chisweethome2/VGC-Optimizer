kind = "web"
previewPath = "/"
title = "VGC Teambuilding Helper"
version = "1.0.0"
id = "artifacts/vgc-teambuilder"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24731

[services.development]
run = "pnpm --filter @workspace/vgc-teambuilder run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/vgc-teambuilder", "run", "build" ]
publicDir = "artifacts/vgc-teambuilder/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24731"
BASE_PATH = "/"
